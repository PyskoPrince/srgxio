<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0a1c4f">
    <meta name="description" content="Sitio web oficial de Sergio Campos. Próximamente disponible.">
    <meta name="author" content="Sergio Campos">
    <title>Sergio Campos | Próximamente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #0a1c4f;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(211, 47, 47, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(255, 204, 0, 0.12) 0%, transparent 45%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 25px;
            position: relative;
        }

        /* Grid sutil de fondo */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        /* --- CONTENEDOR CENTRAL --- */
        .contenedor {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
            animation: aparecer 1.2s ease-out;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Monograma */
        .monograma {
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            border: 3px solid #ffcc00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 38px;
            font-weight: bold;
            color: #ffcc00;
            background: rgba(255, 204, 0, 0.05);
            letter-spacing: 2px;
        }

        .etiqueta {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffcc00;
            font-weight: 600;
            padding: 6px 16px;
            border: 1px solid rgba(255, 204, 0, 0.4);
            border-radius: 50px;
            margin-bottom: 25px;
        }

        .nombre {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 3px;
            line-height: 1.1;
            margin-bottom: 18px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .subtitulo {
            font-size: 16px;
            font-weight: 300;
            opacity: 0.85;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Barra de progreso */
        .progreso {
            width: 100%;
            max-width: 320px;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .progreso::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #ffcc00, #d32f2f);
            border-radius: 2px;
            animation: cargando 2.2s ease-in-out infinite;
        }

        @keyframes cargando {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        /* Pie de página */
        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            z-index: 1;
            padding: 0 20px;
        }

        .footer a {
            color: rgba(255, 204, 0, 0.7);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #ffcc00;
        }

        /* --- CELULARES PEQUEÑOS --- */
        @media (max-width: 380px) {
            .nombre { font-size: 30px; }
            .subtitulo { font-size: 14px; }
            .monograma {
                width: 75px;
                height: 75px;
                font-size: 32px;
            }
        }

        /* --- PANTALLAS GRANDES --- */
        @media (min-width: 768px) {
            .nombre { font-size: 52px; }
            .subtitulo { font-size: 18px; }
            .monograma {
                width: 110px;
                height: 110px;
                font-size: 46px;
            }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <div class="monograma">SC</div>

        <span class="etiqueta">Sitio en construcción</span>

        <h1 class="nombre">Sergio Campos</h1>

        <p class="subtitulo">
            Estoy trabajando en mi sitio web oficial.<br>
            Muy pronto estará disponible.
        </p>

        <div class="progreso"></div>
    </div>

    <div class="footer">
        © 2026 <a href="https://sergiocampos.mx">sergiocampos.mx</a> · Todos los derechos reservados
    </div>

</body>
</html>
